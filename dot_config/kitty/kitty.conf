shell /usr/bin/zsh

font_size 12.0

hide_window_decorations no

adjust_line_height  0
adjust_column_width 0

disable_ligatures never

# BEGIN_KITTY_FONTS
font_family      family="MesloLGS Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
# map cmd+y launch --stdin-source=@screen_scrollback --type=overlay nvim -c "normal G" -c "set nonumber nolist" -

map alt+j
map alt+k map cmd+t map cmd+w

# -----------------------------------------------------------------------------
# Kitty-native tab/session management
# -----------------------------------------------------------------------------

allow_remote_control yes

# Create/close kitty tabs
map cmd+t new_tab
map cmd+w close_tab

# Navigate kitty tabs
map cmd+l next_tab
map cmd+h previous_tab

# Jump to kitty tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# New window/pane inside current tab
map cmd+enter new_window_with_cwd
map cmd+d launch --cwd=current

# Scrollback in overlay
map cmd+y show_scrollback

# zoxide project/session picker
map cmd+k launch --type=overlay --title zoxide ~/.local/bin/kitty-zoxide-session
